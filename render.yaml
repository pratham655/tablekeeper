services:
  # 1. FastAPI Backend API
  - type: web
    name: tablekeeper-backend
    runtime: python
    rootDir: backend/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tablekeeper-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

  # 2. Next.js Frontend
  - type: web
    name: tablekeeper-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: tablekeeper-backend
          property: host

databases:
  # 3. PostgreSQL Database
  - name: tablekeeper-db
    databaseName: tablekeeper
    user: tablekeeper
    plan: free
